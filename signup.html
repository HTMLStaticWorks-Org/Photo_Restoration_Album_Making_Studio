<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <title>Sign Up | MEMORA STUDIO — Create Your Private Archive Vault</title>
  <meta name="description" content="Create your MEMORA STUDIO account to upload vintage photographs, request restoration quotes, and design bespoke family albums." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ivory: '#F8F5EF',
            cream: '#EDE4D6',
            mutedbrown: '#8B6F58',
            espresso: '#30251F',
            gold: '#C5A46D',
            charcoal: '#252525'
          }
        }
      }
    };
  </script>

  <!-- Custom Studio Stylesheet -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="min-h-screen bg-theme-primary text-theme-primary archival-grain flex flex-col justify-between p-4 sm:p-8 selection:bg-[#C5A46D] selection:text-[#14110F]">

  <!-- Minimal Auth Top Utility Bar (No Regular Website Header) -->
  <div class="max-w-6xl w-full mx-auto flex items-center justify-end">
    <!-- Theme & RTL Toggles -->
    <div class="flex items-center gap-2">
      <button type="button" data-action="toggle-rtl" class="w-9 h-9 rounded-full border border-theme-strong flex items-center justify-center text-theme-primary hover:border-[#C5A46D] hover:text-theme-gold transition" aria-label="Toggle LTR/RTL Direction" title="Toggle LTR / RTL Direction">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
      </button>
      <button type="button" data-action="toggle-theme" class="w-9 h-9 rounded-full border border-theme-strong flex items-center justify-center text-theme-primary hover:border-[#C5A46D] transition" aria-label="Toggle Theme">
        <i data-lucide="moon" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Centered Registration Card -->
  <main class="w-full max-w-lg mx-auto my-6">
    <div class="rounded-3xl bg-theme-surface border border-theme-strong shadow-theme-elevated p-7 sm:p-10">

      <!-- Inside Card Header: Clickable Logo + Brand Name Side-by-Side -->
      <div class="flex flex-col items-center text-center mb-7">
        <a href="index.html" class="inline-flex items-center gap-3.5 group mb-4 focus:outline-none" aria-label="Return to MEMORA STUDIO Home 1">
          <div class="w-11 h-11 rounded-xl bg-[#30251F] dark:bg-[#C5A46D] text-[#F8F5EF] dark:text-[#14110F] flex items-center justify-center shadow-md group-hover:scale-105 transition-transform shrink-0">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <circle cx="8.5" cy="9.5" r="1.5"/>
              <path d="M21 15l-5-5L5 20"/>
              <path d="M14 4v4h4"/>
            </svg>
          </div>
          <div class="text-left flex flex-col justify-center">
            <span class="font-serif-editorial text-2xl font-bold tracking-wider text-theme-primary leading-none">MEMORA</span>
            <span class="text-[10px] tracking-[0.28em] uppercase text-theme-gold font-semibold mt-0.5">ARCHIVE &amp; ATELIER</span>
          </div>
        </a>

        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#C5A46D]/15 text-theme-gold text-[11px] font-mono-code uppercase tracking-widest mb-2">
          <i data-lucide="shield-check" class="w-3 h-3"></i> Private Family Vault Registration
        </span>
        <h1 class="font-serif-editorial text-3xl sm:text-4xl font-bold text-theme-primary">Create Your Account</h1>
        <p class="text-xs sm:text-sm text-theme-secondary mt-1">
          Begin preserving your family’s photographs and heirloom albums.
        </p>
      </div>

      <!-- Inside Card Form: One by One Vertical Stack -->
      <form id="signup-form" class="space-y-4" novalidate>
        <!-- First Name -->
        <div>
          <label for="su-first" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">First Name *</label>
          <input id="su-first" type="text" required placeholder="Aarav" class="input-luxury" />
        </div>

        <!-- Last Name -->
        <div>
          <label for="su-last" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">Last Name *</label>
          <input id="su-last" type="text" required placeholder="Singhania" class="input-luxury" />
        </div>

        <!-- Email Address -->
        <div>
          <label for="su-email" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">Email Address *</label>
          <input id="su-email" type="email" required placeholder="aarav@example.com" class="input-luxury" />
        </div>

        <!-- Phone Number -->
        <div>
          <label for="su-phone" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">Phone Number *</label>
          <input id="su-phone" type="tel" required placeholder="+91 98201 54321" class="input-luxury" />
        </div>

        <!-- Password -->
        <div>
          <label for="su-password" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">Password *</label>
          <div class="relative">
            <input id="su-password" type="password" required placeholder="Min 8 characters" class="input-luxury pr-10" />
            <button type="button" data-toggle-pass="su-password" class="absolute inset-y-0 right-3 flex items-center text-theme-muted hover:text-theme-primary" aria-label="Show or Hide Password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="su-confirm" class="block text-xs font-semibold uppercase tracking-wider text-theme-secondary mb-1.5">Confirm Password *</label>
          <div class="relative">
            <input id="su-confirm" type="password" required placeholder="Repeat password" class="input-luxury pr-10" />
            <button type="button" data-toggle-pass="su-confirm" class="absolute inset-y-0 right-3 flex items-center text-theme-muted hover:text-theme-primary" aria-label="Show or Hide Confirm Password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <p id="signup-error-msg" class="text-xs text-red-500 hidden"></p>

        <!-- Terms & Conditions Checkbox -->
        <div class="pt-1">
          <label class="inline-flex items-start gap-2.5 cursor-pointer text-xs text-theme-secondary">
            <input id="su-terms" type="checkbox" required class="w-4 h-4 accent-[#C5A46D] rounded mt-0.5" />
            <span>I agree to the <a href="pricing.html" class="text-theme-gold underline">Terms &amp; Conditions</a> and Private Family Archive Confidentiality Charter. *</span>
          </label>
        </div>

        <button type="submit" class="btn-luxury-primary w-full mt-2">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Create Account</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6 flex items-center justify-center">
        <div class="border-t border-theme w-full"></div>
        <span class="bg-theme-surface px-3 text-[11px] font-mono-code uppercase tracking-wider text-theme-muted shrink-0">Or sign up with</span>
        <div class="border-t border-theme w-full"></div>
      </div>

      <!-- Social Signup Buttons: Icons Only (Google, Facebook, Apple) -->
      <div class="flex items-center justify-center gap-4">
        <!-- Google -->
        <button type="button" data-social-signup="Google" aria-label="Sign up with Google" title="Google" class="w-12 h-12 rounded-2xl border border-theme-strong bg-theme-primary hover:border-[#C5A46D] hover:scale-105 transition flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"/>
          </svg>
        </button>

        <!-- Facebook -->
        <button type="button" data-social-signup="Facebook" aria-label="Sign up with Facebook" title="Facebook" class="w-12 h-12 rounded-2xl border border-theme-strong bg-theme-primary hover:border-[#C5A46D] hover:scale-105 transition flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/>
          </svg>
        </button>

        <!-- Apple -->
        <button type="button" data-social-signup="Apple" aria-label="Sign up with Apple" title="Apple" class="w-12 h-12 rounded-2xl border border-theme-strong bg-theme-primary hover:border-[#C5A46D] hover:scale-105 transition flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5 text-theme-primary" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.85.94-2.93-.93.04-2.03.62-2.69 1.39-.58.67-1.09 1.76-.95 2.81 1.03.08 2.07-.5 2.7-1.27z"/>
          </svg>
        </button>
      </div>

      <!-- Link to Login -->
      <p class="text-center text-xs text-theme-secondary mt-7">
        Already have a client vault?
        <a href="login.html" class="font-semibold text-theme-gold hover:underline ml-1">Sign In Here</a>
      </p>
    </div>
  </main>

  <div class="text-center text-xs text-theme-muted">
    <span>© 2026 MEMORA STUDIO Pvt. Ltd. • Archival Privacy Guaranteed</span>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Show/Hide Password Toggles
      document.querySelectorAll('[data-toggle-pass]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const inputId = btn.getAttribute('data-toggle-pass');
          const input = document.getElementById(inputId);
          if (!input) return;
          const isPass = input.type === 'password';
          input.type = isPass ? 'text' : 'password';
          btn.innerHTML = `<i data-lucide="${isPass ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
          if (window.lucide) window.lucide.createIcons();
        });
      });

      // Social signup buttons
      document.querySelectorAll('[data-social-signup]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const provider = btn.getAttribute('data-social-signup');
          window.showMemoraToast(`Connecting to ${provider} authentication...`);
          setTimeout(() => {
            const demoUser = {
              firstName: 'Aarav',
              lastName: 'Singhania',
              email: 'aarav.singhania@heritage.in',
              phone: '+91 98201 54321',
              avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=250&q=80',
              role: 'Vault Client'
            };
            localStorage.setItem('memora_user', JSON.stringify(demoUser));
            window.showMemoraToast(`Account created via ${provider}! Redirecting to Dashboard...`);
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 750);
          }, 800);
        });
      });

      // Signup Form Validation
      const form = document.getElementById('signup-form');
      const errBox = document.getElementById('signup-error-msg');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const firstName = document.getElementById('su-first').value.trim();
        const lastName = document.getElementById('su-last').value.trim();
        const email = document.getElementById('su-email').value.trim();
        const phone = document.getElementById('su-phone').value.trim();
        const pass = document.getElementById('su-password').value;
        const confirm = document.getElementById('su-confirm').value;
        const terms = document.getElementById('su-terms').checked;

        if (!firstName || !lastName || !email || !phone) {
          errBox.textContent = 'Please fill in your name, email address, and phone number.';
          errBox.classList.remove('hidden');
          return;
        }
        if (!email.includes('@')) {
          errBox.textContent = 'Please provide a valid email address.';
          errBox.classList.remove('hidden');
          return;
        }
        if (pass.length < 8) {
          errBox.textContent = 'Password must be at least 8 characters long.';
          errBox.classList.remove('hidden');
          return;
        }
        if (pass !== confirm) {
          errBox.textContent = 'Password and Confirm Password do not match.';
          errBox.classList.remove('hidden');
          return;
        }
        if (!terms) {
          errBox.textContent = 'Please accept the Terms & Conditions to create your vault.';
          errBox.classList.remove('hidden');
          return;
        }

        errBox.classList.add('hidden');
        localStorage.setItem(
          'memora_user',
          JSON.stringify({
            firstName,
            lastName,
            email,
            phone,
            memberSince: 'November 2026'
          })
        );
        window.showMemoraToast('Account created! Welcome to your Customer Dashboard...');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 700);
      });

      document.querySelectorAll('[data-social-signup]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const provider = btn.getAttribute('data-social-signup');
          localStorage.setItem(
            'memora_user',
            JSON.stringify({
              firstName: 'Aarav',
              lastName: 'Singhania',
              email: 'aarav.singhania@heritage.in',
              phone: '+91 98201 67890',
              provider
            })
          );
          window.showMemoraToast(`Account registered via ${provider}! Redirecting...`);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 700);
        });
      });
    });
  </script>
</body>
</html>
